# Daily rebuild and deploy, so pages with a future datePublished go live on their day.
# For Cloudflare and Netlify sites (GitHub Pages sites don't need it: deploy.yml already
# rebuilds every day). Opt in: Settings → Secrets and variables → Actions:
#   - variable VAGE_DAILY_DEPLOY = true
#   - secrets for your host: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, or NETLIFY_AUTH_TOKEN
# GitHub pauses scheduled workflows in repositories with no activity for 60 days.
name: Publish scheduled pages

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.VAGE_DAILY_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so seo.lastmod: "git" can date pages
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vage deploy --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
          GTM_CONTAINER_ID: ${{ vars.GTM_CONTAINER_ID }}

name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails on known high-severity vulnerabilities in dependencies (supply-chain attacks, injected code).
      - run: npm audit --audit-level=high
      - run: npx vage check
      - run: npx vage build
      - run: npx vage audit
      # Downloadable build preview for reviewers (Actions run → Artifacts).
      - uses: actions/upload-artifact@v7
        with:
          name: site-preview
          path: dist
          retention-days: 7

name: Feature request
description: Suggest something vagejs should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you're in, not only the feature you want.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like vagejs to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
      description: Workarounds or other tools you use.

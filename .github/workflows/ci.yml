name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      # GitHub-hosted Ubuntu runners include Chrome.
      - run: npx vitest run tests/audit.test.ts -t "real Lighthouse"
        env:
          VAGE_TEST_LIGHTHOUSE: "1"
